<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Net — HackNHeal</title>
<link rel="stylesheet" href="../assets/tokens.css">
<script src="../assets/vendor/d3.v7.9.0.min.js"></script>
<script src="../lib/poster.js"></script>
</head>
<body>
<script>
(async () => {
  const P = await Poster.create({
    num: '04', id: 'unet', title: 'U-Net',
    subtitle: 'Biomedical image segmentation · Ronneberger et al., 2015',
    hudTop: 'FULLY CONVOLUTIONAL · VALID CONVS', hudSub: 'TILE 572² → MAP 388² × 2',
  });
  const { W, H, C, g, rng, isBg, text, defs } = P;

  // ---------------- seeded value noise (for the MRI phantom) ----------------
  const nrng = rng.fork('noise');
  const GN = 64;
  const grid = Array.from({ length: GN * GN }, () => nrng.random());
  const sm = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = sm(x - xi), yf = sm(y - yi);
    const at = (i, j) => grid[((j % GN + GN) % GN) * GN + ((i % GN + GN) % GN)];
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  };
  const fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); a *= 0.5; f *= 2; } return s; };

  // phantom geometry in [-1,1]² (u right, v down). Tumour sits inside the central 388/572 region.
  const trng = rng.fork('tumour');
  const tum = { u: trng.uniform(0.12, 0.3) * (trng.random() < 0.5 ? -1 : 1), v: trng.uniform(-0.3, -0.05), r: trng.uniform(0.15, 0.19) };
  const brainR = (u, v) => Math.hypot(u / 0.74, v / 0.9);
  const tumourField = (u, v) => {
    const d = Math.hypot(u - tum.u, (v - tum.v) * 1.1);
    const wob = 1 + 0.35 * (fbm(u * 4 + 11, v * 4 + 7, 3) - 0.5);
    return 1 - d / (tum.r * wob); // > 0 inside the lesion
  };
  function mriDataURL(N) {
    const cv = document.createElement('canvas'); cv.width = cv.height = N;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(N, N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const u = (i / (N - 1)) * 2 - 1, v = (j / (N - 1)) * 2 - 1;
      const r = brainR(u, v);
      const edge = 0.96 + 0.05 * (fbm(u * 3, v * 3) - 0.5);
      let I = 0;
      if (r < edge) {
        // white matter base, folded cortex near the edge
        const sulci = Math.abs(Math.sin((fbm(u * 5 + 3, v * 5 + 1, 4) * 9 + r * 14)));
        const cort = Math.max(0, Math.min(1, (r - 0.62) / 0.3));
        I = 0.42 + 0.12 * fbm(u * 9, v * 9) + cort * (0.18 * sulci - 0.04);
        // lateral ventricles (dark in FLAIR)
        for (const s of [-1, 1]) {
          const vu = (u - s * 0.11) / 0.07, vv = (v + 0.02) / 0.26;
          const dv = vu * vu + vv * vv;
          if (dv < 1) I *= 0.25 + 0.75 * dv;
        }
        // midline
        I *= 0.75 + 0.25 * Math.min(1, Math.abs(u) / 0.02);
        // lesion: hyperintense core + oedema halo
        const t = tumourField(u, v);
        if (t > -0.7) I += 0.32 * Math.max(0, Math.min(1, (t + 0.7) / 0.7)) ** 2;
        if (t > 0) I += 0.22 + 0.1 * fbm(u * 14, v * 14);
      } else if (r < 1.07) {
        I = 0.12 + 0.05 * fbm(u * 20, v * 20); // CSF/skull rim (dark-ish)
      } else if (r < 1.14) {
        I = 0.5 + 0.15 * fbm(u * 18, v * 18); // scalp
      }
      I += (nrng.random() - 0.5) * 0.05; // acquisition noise
      I = Math.max(0, Math.min(1, I));
      const k = (j * N + i) * 4;
      img.data[k] = 255 * Math.pow(I, 1.05) * 0.92;
      img.data[k + 1] = 255 * Math.pow(I, 1.0);
      img.data[k + 2] = 255 * Math.pow(I, 0.95);
      img.data[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return cv.toDataURL('image/png');
  }

  // ---------------- U-Net feature maps (exact dims from the paper) ----------------
  const rowY = isBg ? [430, 770, 1100, 1430, 1760] : [700, 960, 1195, 1415, 1625];
  const barH = isBg ? [300, 240, 190, 150, 120] : [230, 180, 150, 128, 112];
  const x0 = isBg ? 230 : 820, step = isBg ? 176 : 120;
  const X = (p) => x0 + p * step;
  const bw = (ch) => (ch <= 2 ? 8 : 10 + 9.5 * Math.log2(ch / 32));
  // [pos, level, size, ch, kind]
  const bars = [
    [0, 0, 572, 1, 'in'], [1, 0, 570, 64, 'f'], [2, 0, 568, 64, 'f'],
    [2, 1, 284, 64, 'f'], [3, 1, 282, 128, 'f'], [4, 1, 280, 128, 'f'],
    [4, 2, 140, 128, 'f'], [5, 2, 138, 256, 'f'], [6, 2, 136, 256, 'f'],
    [6, 3, 68, 256, 'f'], [7, 3, 66, 512, 'f'], [8, 3, 64, 512, 'f'],
    [8, 4, 32, 512, 'f'], [9, 4, 30, 1024, 'f'], [10, 4, 28, 1024, 'f'],
    [10, 3, 56, 512, 'cat'], [11, 3, 54, 512, 'f'], [12, 3, 52, 512, 'f'],
    [12, 2, 104, 256, 'cat'], [13, 2, 102, 256, 'f'], [14, 2, 100, 256, 'f'],
    [14, 1, 200, 128, 'cat'], [15, 1, 198, 128, 'f'], [16, 1, 196, 128, 'f'],
    [16, 0, 392, 64, 'cat'], [17, 0, 390, 64, 'f'], [18, 0, 388, 64, 'f'],
    [19, 0, 388, 2, 'out'],
  ].map(([p, l, s, ch, k]) => {
    const w = k === 'cat' ? 2 * bw(ch) : bw(ch);
    const h = barH[l];
    const cx = X(p);
    return { p, l, s, ch, k, w, h, x: cx - w / 2, y: rowY[l] - h / 2, cx, cy: rowY[l] };
  });
  const at = (p, l) => bars.find((b) => b.p === p && b.l === l);
  const arrowY = (b) => b.y + b.h * 0.24;

  const arcs = g.append('g');
  const bg = g.append('g');
  const glow = g.append('g').attr('filter', 'url(#glow-s)');
  const ar = g.append('g');
  const lab = g.append('g');

  // bars
  for (const b of bars) {
    if (b.k === 'cat') {
      const hw = b.w / 2;
      // cropped copy (from encoder) + upsampled half
      bg.append('rect').attr('x', b.x).attr('y', b.y).attr('width', hw).attr('height', b.h)
        .attr('fill', C.white).attr('fill-opacity', 0.1).attr('stroke', C.white).attr('stroke-opacity', 0.75)
        .attr('stroke-width', 2.5).attr('stroke-dasharray', '7 5');
      glow.append('rect').attr('x', b.x + hw).attr('y', b.y).attr('width', hw).attr('height', b.h)
        .attr('fill', C.amber).attr('fill-opacity', 0.28).attr('stroke', C.amber).attr('stroke-width', 3);
    } else {
      const col = b.k === 'out' ? C.amber : b.k === 'in' ? C.white : C.cyan;
      const fo = b.k === 'in' ? 0.5 : 0.16 + 0.12 * Math.log2(b.ch / 64 + 1) / 4;
      glow.append('rect').attr('x', b.x).attr('y', b.y).attr('width', b.w).attr('height', b.h)
        .attr('fill', col).attr('fill-opacity', b.k === 'out' ? 0.6 : fo).attr('stroke', col).attr('stroke-width', 3);
      // depth hairlines (channels) for a "stack" look
      const n = Math.min(6, Math.round(b.w / 9));
      for (let i = 1; i < n; i++) {
        bg.append('line').attr('x1', b.x + (b.w * i) / n).attr('x2', b.x + (b.w * i) / n).attr('y1', b.y + 6).attr('y2', b.y + b.h - 6)
          .attr('stroke', col).attr('stroke-opacity', 0.25).attr('stroke-width', 1.5);
      }
    }
  }

  const arrow = (pts, col, marker, w = 4) => ar.append('path').attr('d', d3.line()(pts)).attr('fill', 'none')
    .attr('stroke', col).attr('stroke-width', w).attr('marker-end', `url(#${marker})`);

  // conv 3×3 + ReLU arrows (same row, consecutive positions)
  const convPairs = [];
  for (const b of bars) {
    const nxt = at(b.p + 1, b.l);
    if (nxt) convPairs.push([b, nxt]);
  }
  for (const [a, b] of convPairs) {
    const y = arrowY(a.h < b.h ? a : b);
    const isOut = b.k === 'out';
    arrow([[a.x + a.w + 6, y], [b.x - 8, y]], isOut ? C.white : C.cyan, isOut ? 'arr-white' : 'arr-cyan');
  }
  // max-pool (down) and up-conv (up)
  for (let l = 0; l < 4; l++) {
    const a = at(2 * l + 2, l), b = at(2 * l + 2, l + 1);
    arrow([[a.cx, a.y + a.h + 6], [b.cx, b.y - 10]], C.magenta, 'arr-magenta', 5);
  }
  for (let l = 3; l >= 0; l--) {
    const dst = bars.find((b) => b.k === 'cat' && b.l === l);
    const s = at(dst.p, l + 1); // last bar of the level below
    arrow([[dst.x + dst.w * 0.75, s.y - 6], [dst.x + dst.w * 0.75, dst.y + dst.h + 10]], C.amber, 'arr-amber', 5);
  }
  // copy & crop: glowing arcs from encoder level output to decoder concat
  const arcG = arcs.append('g').attr('filter', 'url(#glow-m)');
  for (let l = 0; l < 4; l++) {
    const a = at(2 * l + 2, l);
    const b = bars.find((d) => d.k === 'cat' && d.l === l);
    const xa = a.x + a.w + 8, xb = b.x - 10;
    const y = a.y + a.h * 0.6;
    const bulge = l === 3 ? 80 : Math.min(150, (xb - xa) * 0.12) + 30;
    const d = `M${xa} ${y}C${xa + (xb - xa) * 0.3} ${y - bulge} ${xa + (xb - xa) * 0.7} ${y - bulge} ${xb} ${y}`;
    arcG.append('path').attr('d', d).attr('fill', 'none').attr('stroke', C.cyan).attr('stroke-width', 5)
      .attr('stroke-opacity', 0.9).attr('stroke-dasharray', '18 10').attr('marker-end', 'url(#arr-cyan)');
    arcs.append('path').attr('d', d).attr('fill', 'none').attr('stroke', '#e8fdff').attr('stroke-width', 2).attr('stroke-dasharray', '18 10');
    b.arcMid = { x: (xa + xb) / 2, y: l === 3 ? y + 66 : y - bulge * 0.75 };
    b.crop = `${a.s}² → ${b.s}²`;
    b.short = l === 3;
  }

  // labels: channels on top, spatial size rotated at lower-left of each bar
  if (!isBg) {
    // bars whose top edge receives a vertical arrow get their channel label nudged aside
    const poolTargets = new Set([[2, 1], [4, 2], [6, 3], [8, 4]].map(([p, l]) => p + ':' + l));
    const upSources = new Set([[10, 4], [12, 3], [14, 2], [16, 1]].map(([p, l]) => p + ':' + l));
    for (const b of bars) {
      const ch = b.k === 'cat' ? b.ch * 2 : b.ch;
      const key = b.p + ':' + b.l;
      const [lx, anc] = poolTargets.has(key) ? [b.cx - 16, 'end'] : upSources.has(key) ? [b.cx + 42, 'start'] : [b.cx, 'middle'];
      text(lab, lx, b.y - 16, String(ch), { size: 28, anchor: anc, fill: b.k === 'out' ? C.amber : C.white, opacity: 0.9, weight: 500 });
      const t = text(lab, 0, 0, `${b.s}²`, { size: 28, fill: C.white, opacity: 0.6 });
      t.attr('transform', `translate(${b.x - 10} ${b.y + b.h - 4}) rotate(-90)`);
    }
    // crop annotations on the arcs
    // (level-3 crop 64² → 56² is already readable from the bar labels; its arc is too short for a caption)
    for (const b of bars.filter((d) => d.k === 'cat' && !d.short)) {
      text(lab, b.arcMid.x, b.arcMid.y - 20, b.short ? b.crop.replace(/ /g, '') : `copy & crop · ${b.crop}`, { size: 28, anchor: 'middle', fill: C.cyan, opacity: 0.9 });
    }
    text(lab, X(9), rowY[4] + barH[4] / 2 + 60, 'BOTTLENECK · 28² × 1024', { size: 30, anchor: 'middle', fill: C.white, opacity: 0.8, spacing: 3 });
    text(lab, X(1), rowY[0] - barH[0] / 2 - 70, 'ENCODER · contracting', { size: 30, anchor: 'start', fill: C.cyan, spacing: 3 });
    text(lab, X(18), rowY[0] - barH[0] / 2 - 70, 'DECODER · expanding', { size: 30, anchor: 'end', fill: C.amber, spacing: 3 });
  }

  // ---------------- images ----------------
  const imgS = isBg ? 0 : 520;
  if (!isBg) {
    const mx = 180, my = 600;
    const url = mriDataURL(420);
    const clip = defs.append('clipPath').attr('id', 'mri-clip');
    clip.append('rect').attr('x', mx).attr('y', my).attr('width', imgS).attr('height', imgS).attr('rx', 10);
    g.append('image').attr('href', url).attr('x', mx).attr('y', my).attr('width', imgS).attr('height', imgS)
      .attr('clip-path', 'url(#mri-clip)').attr('preserveAspectRatio', 'none');
    // scanlines + frame
    const fr = g.append('g');
    for (let y = my; y < my + imgS; y += 6) fr.append('line').attr('x1', mx).attr('x2', mx + imgS).attr('y1', y).attr('y2', y).attr('stroke', '#000').attr('stroke-opacity', 0.18).attr('stroke-width', 2);
    fr.append('rect').attr('x', mx).attr('y', my).attr('width', imgS).attr('height', imgS).attr('rx', 10)
      .attr('fill', 'none').attr('stroke', C.cyan).attr('stroke-width', 3).attr('stroke-opacity', 0.8);
    // output region of the tile: central 388/572
    const k = 388 / 572, inner = imgS * k, off = (imgS - inner) / 2;
    fr.append('rect').attr('x', mx + off).attr('y', my + off).attr('width', inner).attr('height', inner)
      .attr('fill', 'none').attr('stroke', C.amber).attr('stroke-width', 2.5).attr('stroke-dasharray', '10 8');
    text(g, mx, my + imgS + 50, 'INPUT · FLAIR MRI (phantom)', { size: 30, fill: C.cyan, spacing: 2 });
    text(g, mx, my + imgS + 94, '572 × 572 × 1 tile', { size: 30, opacity: 0.7 });
    text(g, mx, my + imgS + 138, 'dashed: 388² output region', { size: 28, fill: C.amber, opacity: 0.85 });
    // input arrow into the first bar
    const b0 = bars[0];
    arrow([[mx + imgS + 10, arrowY(b0)], [b0.x - 12, arrowY(b0)]], C.white, 'arr-white');

    // output segmentation (vector contours of the same phantom, cropped to 388/572)
    const ox = 3180, oy = 600, oS = 520;
    const NG = 160;
    const sampleCrop = (fn) => {
      const vals = new Array(NG * NG);
      for (let j = 0; j < NG; j++) for (let i = 0; i < NG; i++) {
        const u = ((i / (NG - 1)) * 2 - 1) * k, v = ((j / (NG - 1)) * 2 - 1) * k;
        vals[j * NG + i] = fn(u, v);
      }
      return vals;
    };
    const cont = d3.contours().size([NG, NG]);
    const tr = d3.geoTransform({ point(x, y) { this.stream.point(ox + (x / (NG - 1)) * oS, oy + (y / (NG - 1)) * oS); } });
    const path = d3.geoPath(tr);
    const oc = defs.append('clipPath').attr('id', 'out-clip');
    oc.append('rect').attr('x', ox).attr('y', oy).attr('width', oS).attr('height', oS).attr('rx', 10);
    const og = g.append('g').attr('clip-path', 'url(#out-clip)');
    og.append('rect').attr('x', ox).attr('y', oy).attr('width', oS).attr('height', oS).attr('fill', '#03050a');
    const brainVals = sampleCrop((u, v) => 1 - brainR(u, v));
    const tumVals = sampleCrop(tumourField);
    // faint anatomy contours for context
    for (const th of [0.05, 0.25, 0.45]) {
      og.append('path').attr('d', path(cont.thresholds([th])(brainVals)[0])).attr('fill', 'none')
        .attr('stroke', C.cyan).attr('stroke-opacity', th === 0.05 ? 0.5 : 0.18).attr('stroke-width', 2);
    }
    const tc = cont.thresholds([0])(tumVals)[0];
    og.append('path').attr('d', path(tc)).attr('fill', C.amber).attr('fill-opacity', 0.95).attr('filter', 'url(#glow-m)');
    og.append('path').attr('d', path(tc)).attr('fill', 'none').attr('stroke', '#fff3cc').attr('stroke-width', 3);
    // pixel grid hint
    for (let i = 1; i < 8; i++) {
      og.append('line').attr('x1', ox + (oS * i) / 8).attr('x2', ox + (oS * i) / 8).attr('y1', oy).attr('y2', oy + oS).attr('stroke', C.white).attr('stroke-opacity', 0.06).attr('stroke-width', 1.5);
      og.append('line').attr('y1', oy + (oS * i) / 8).attr('y2', oy + (oS * i) / 8).attr('x1', ox).attr('x2', ox + oS).attr('stroke', C.white).attr('stroke-opacity', 0.06).attr('stroke-width', 1.5);
    }
    g.append('rect').attr('x', ox).attr('y', oy).attr('width', oS).attr('height', oS).attr('rx', 10)
      .attr('fill', 'none').attr('stroke', C.amber).attr('stroke-width', 3).attr('stroke-opacity', 0.85);
    text(g, ox, oy + oS + 50, 'OUTPUT · segmentation map', { size: 30, fill: C.amber, spacing: 2 });
    text(g, ox, oy + oS + 94, '388 × 388 × 2 (bg / tumour)', { size: 30, opacity: 0.7 });
    const bl = bars[bars.length - 1];
    arrow([[bl.x + bl.w + 8, arrowY(bl)], [ox - 12, arrowY(bl)]], C.amber, 'arr-amber');
    text(lab, bl.x + bl.w + 4, bl.y + bl.h + 50, 'conv 1×1', { size: 28, anchor: 'end', fill: C.white, opacity: 0.7 });

    // legend (lower left)
    const lx = 190, ly = 1540;
    const lg = g.append('g');
    text(lg, lx, ly, 'LEGEND', { size: 28, fill: C.cyan, spacing: 4, weight: 500 });
    const items = [
      ['h', C.cyan, 'arr-cyan', 'conv 3×3 (valid) + ReLU'],
      ['v', C.magenta, 'arr-magenta', 'max pool 2×2, stride 2'],
      ['u', C.amber, 'arr-amber', 'up-conv 2×2 (halves channels)'],
      ['a', C.cyan, 'arr-cyan', 'copy & crop (skip connection)'],
      ['h', C.white, 'arr-white', 'conv 1×1 → class scores'],
    ];
    items.forEach(([kind, col, mk, label], i) => {
      const y = ly + 62 + i * 62;
      const pth = kind === 'h' ? [[lx, y - 10], [lx + 90, y - 10]]
        : kind === 'v' ? [[lx + 45, y - 34], [lx + 45, y + 12]]
          : kind === 'u' ? [[lx + 45, y + 12], [lx + 45, y - 34]] : null;
      if (pth) lg.append('path').attr('d', d3.line()(pth)).attr('stroke', col).attr('stroke-width', 5).attr('fill', 'none').attr('marker-end', `url(#${mk})`);
      else lg.append('path').attr('d', `M${lx} ${y - 4}Q${lx + 45} ${y - 44} ${lx + 90} ${y - 4}`).attr('stroke', col).attr('stroke-width', 5)
        .attr('fill', 'none').attr('stroke-dasharray', '14 8').attr('marker-end', `url(#${mk})`).attr('filter', 'url(#glow-s)');
      text(lg, lx + 130, y, label, { size: 30, opacity: 0.85 });
    });

    // formulas (lower right)
    const fx = 2420, fy = 1600;
    const fg = g.append('g');
    fg.append('path').attr('d', `M${fx - 30} ${fy - 40}h44M${fx - 30} ${fy - 40}v44`).attr('stroke', C.cyan).attr('stroke-width', 3).attr('fill', 'none');
    text(fg, fx, fy, 'PIXEL-WISE SOFTMAX + WEIGHTED CROSS-ENTROPY', { size: 28, fill: C.cyan, spacing: 2, weight: 500 });
    text(fg, fx, fy + 76, 'p_{k}(x) = exp(a_{k}(x)) / Σ_{k′} exp(a_{k′}(x))', { size: 38, weight: 500 });
    text(fg, fx, fy + 150, 'E = − Σ_{x∈Ω} w(x) log p_{ℓ(x)}(x)', { size: 38, weight: 500 });
    text(fg, fx, fy + 220, 'w(x): class balance + border weight between touching cells', { size: 28, opacity: 0.6 });
    text(fg, fx, fy + 266, '23 conv layers · 572 → 388 because every 3×3 conv is unpadded', { size: 28, opacity: 0.6 });
  }

  P.done();
})();
</script>
</body>
</html>
