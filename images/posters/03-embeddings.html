<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embedding Space — HackNHeal</title>
<link rel="stylesheet" href="../assets/tokens.css">
<script src="../assets/vendor/d3.v7.9.0.min.js"></script>
<script src="../lib/poster.js"></script>
</head>
<body>
<script>
(async () => {
  const P = await Poster.create({
    num: '03', id: 'embeddings', title: 'Embedding Space', titleSize: 124,
    subtitle: 'Protein embeddings · cosine similarity · k-nearest neighbours',
    hudTop: 'PROJECTION 3D → 2D · ISOMETRIC', hudSub: 'METRIC: COSINE · k = 5',
  });
  const { W, H, C, g, rng, isBg, text } = P;

  // ---------- vector helpers ----------
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = (a) => Math.hypot(a[0], a[1], a[2]);
  const scale = (a, s) => a.map((v) => v * s);
  const add = (a, b) => a.map((v, i) => v + b[i]);
  const unit = (a) => scale(a, 1 / norm(a));
  const cos = (a, b) => dot(a, b) / (norm(a) * norm(b));
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  // ---------- isometric projection (z up) ----------
  const S = isBg ? 860 : 500;
  const O = isBg ? [W / 2, H / 2 + 70] : [1560, 1230];
  const c30 = Math.cos(Math.PI / 6), s30 = 0.5;
  const proj = (p) => [O[0] + (p[1] - p[0]) * c30 * S, O[1] + ((p[0] + p[1]) * s30 - p[2]) * S];
  const depth = (p) => (p[0] + p[1] + p[2]) / Math.sqrt(3); // toward the viewer
  // orthonormal view basis: screen-right, screen-up, toward viewer
  const eR = unit([-1, 1, 0]), eU = unit([-1, -1, 2]), eV = unit([1, 1, 1]);
  // direction from a screen angle φ (deg, 0 = right, CCW) and a tilt ψ toward the viewer
  const sdir = (phi, psi) => {
    const f = phi * Math.PI / 180, s = psi * Math.PI / 180;
    return add(add(scale(eR, Math.cos(s) * Math.cos(f)), scale(eU, Math.cos(s) * Math.sin(f))), scale(eV, Math.sin(s)));
  };

  // ---------- data ----------
  const clusters = [
    { key: 'kin', name: 'kinases', dir: sdir(178, 18), color: C.cyan, hollow: false },
    { key: 'onco', name: 'oncogenes', dir: sdir(222, -8), color: C.magenta, hollow: false },
    { key: 'ts', name: 'tumor suppressors', dir: sdir(102, 10), color: C.amber, hollow: false },
    { key: 'ab', name: 'antibodies', dir: sdir(28, -14), color: C.white, hollow: false },
    { key: 'lig', name: 'ligands', dir: sdir(-48, 22), color: C.cyan, hollow: true },
  ];
  // query: a kinase near its centre
  const kin = clusters[0];
  // offset from the centre (toward screen-up) so neighbour scores spread out
  const q = { p: scale(unit(add(unit(kin.dir), scale(eU, 0.2))), 1.04), c: kin, name: 'JAK2' };
  const NPC = 34;
  const crng = rng.fork('cloud');
  const pts = [];
  for (const c of clusters) {
    const u = unit(c.dir);
    c.center = u;
    for (let i = 0; i < NPC; i++) {
      const r = crng.normal(1.0, 0.08);
      const sd = 0.17;
      const p = add(scale(u, r), [crng.normal(0, sd), crng.normal(0, sd), crng.normal(0, sd)]);
      const [sx, sy] = proj(p);
      if (!isBg && sx < 1700 && sy < 470) { i--; continue; } // keep the title block clear
      if (cos(p, q.p) > 0.999) { i--; continue; } // no near-duplicate of the query (would print 1.000)
      pts.push({ p, c });
    }
  }
  // b: rotate a by exactly arccos(0.93) toward the oncogene direction
  const a = q.p;
  const theta = Math.acos(0.93);
  const ua = unit(a);
  const toward = unit(clusters[1].dir);
  const perp = unit(add(toward, scale(ua, -dot(toward, ua))));
  const bDir = add(scale(ua, Math.cos(theta)), scale(perp, Math.sin(theta)));
  const bPt = { p: scale(bDir, 1.1), c: clusters[1], name: 'BRAF' };
  const cosAB = cos(a, bPt.p); // = 0.93 by construction

  // k-NN by cosine over the cloud
  const scored = pts.map((d) => ({ ...d, s: cos(q.p, d.p) })).sort((x, y) => y.s - x.s);
  const K = 5;
  const knn = scored.slice(0, K);
  const knnNames = ['CDK2', 'MAPK1', 'PLK1', 'AURKA', 'CDK4'];
  knn.forEach((d, i) => { d.name = knnNames[i]; d.knn = true; });
  const knnSet = new Set(knn.map((d) => d.p));

  // ---------- background "UMAP" filaments ----------
  const brng = rng.fork('umap');
  const bgG = g.append('g');
  for (let s = 0; s < (isBg ? 26 : 18); s++) {
    let x = brng.uniform(150, W - 150), y = brng.uniform(500, H - 160);
    let ang = brng.uniform(0, Math.PI * 2);
    const col = brng.pick([C.cyan, C.magenta, C.amber, C.white, C.cyan]);
    const steps = brng.int(40, 90);
    for (let k = 0; k < steps; k++) {
      ang += brng.normal(0, 0.18);
      x += Math.cos(ang) * 14; y += Math.sin(ang) * 14;
      for (let m = 0; m < 3; m++) {
        bgG.append('circle').attr('cx', x + brng.normal(0, 16)).attr('cy', y + brng.normal(0, 16))
          .attr('r', brng.uniform(1.5, 4)).attr('fill', col).attr('fill-opacity', brng.uniform(0.06, 0.2));
      }
    }
  }

  // ---------- axes (full ±, negative half dashed), floor grid ----------
  const ax = g.append('g');
  const L = 1.4, G = 1.25;
  for (let t = -G; t <= G + 1e-6; t += 0.25) {
    for (const [p1, p2] of [[[t, -G, 0], [t, G, 0]], [[-G, t, 0], [G, t, 0]]]) {
      const a1 = proj(p1), a2 = proj(p2);
      ax.append('line').attr('x1', a1[0]).attr('y1', a1[1]).attr('x2', a2[0]).attr('y2', a2[1])
        .attr('stroke', C.cyan).attr('stroke-opacity', Math.abs(t) < 1e-6 ? 0 : 0.09).attr('stroke-width', 1.5);
    }
  }
  const axes = [[[1, 0, 0], 'z_{1}'], [[0, 1, 0], 'z_{2}'], [[0, 0, 1], 'z_{3}']];
  const p0 = proj([0, 0, 0]);
  for (const [e, lab] of axes) {
    const pp = proj(scale(e, L)), pn = proj(scale(e, -L * 0.85));
    ax.append('line').attr('x1', p0[0]).attr('y1', p0[1]).attr('x2', pp[0]).attr('y2', pp[1])
      .attr('stroke', C.white).attr('stroke-opacity', 0.6).attr('stroke-width', 3).attr('marker-end', 'url(#arr-white)');
    ax.append('line').attr('x1', p0[0]).attr('y1', p0[1]).attr('x2', pn[0]).attr('y2', pn[1])
      .attr('stroke', C.white).attr('stroke-opacity', 0.25).attr('stroke-width', 2).attr('stroke-dasharray', '6 10');
    for (const t of [-1, -0.5, 0.5, 1.0]) {
      const tp = proj(scale(e, t));
      ax.append('circle').attr('cx', tp[0]).attr('cy', tp[1]).attr('r', 5).attr('fill', C.white).attr('fill-opacity', t > 0 ? 0.6 : 0.3);
    }
    if (!isBg) {
      const lp = proj(scale(e, L * 1.1));
      text(ax, lp[0], lp[1] + 14, lab, { size: 40, anchor: 'middle', fill: C.white, opacity: 0.85, weight: 500 }).attr('class', 'axis-label');
    }
  }
  if (!isBg) text(ax, p0[0] + 26, p0[1] + 46, 'O', { size: 34, opacity: 0.7 });

  // ---------- points (depth sorted) ----------
  const ptsG = g.append('g');
  const all = pts.slice().sort((x, y) => depth(x.p) - depth(y.p));
  for (const d of all) {
    if (d.p === q.p) continue;
    const [x, y] = proj(d.p);
    const dep = depth(d.p);
    const r = 10 + 4 * dep;
    const op = 0.6 + 0.25 * dep;
    const isK = knnSet.has(d.p);
    const el = ptsG.append('circle').attr('cx', x).attr('cy', y).attr('r', Math.max(6, r));
    if (d.c.hollow) el.attr('fill', C.bg).attr('fill-opacity', 0.6).attr('stroke', d.c.color).attr('stroke-width', 3).attr('stroke-opacity', op);
    else el.attr('fill', d.c.color).attr('fill-opacity', isK ? 1 : op);
  }
  // cluster halos
  const halo = g.insert('g', ':first-child').attr('filter', 'url(#halo)');
  for (const c of clusters) {
    const [x, y] = proj(c.center);
    halo.append('ellipse').attr('cx', x).attr('cy', y).attr('rx', 130).attr('ry', 100)
      .attr('fill', c.color).attr('fill-opacity', c.hollow ? 0.08 : 0.12);
  }

  // ---------- vectors a, b with angle ----------
  const vg = g.append('g').attr('filter', 'url(#glow-s)');
  const o2 = proj([0, 0, 0]);
  const pa = proj(a), pb = proj(bPt.p);
  vg.append('line').attr('x1', o2[0]).attr('y1', o2[1]).attr('x2', pa[0]).attr('y2', pa[1])
    .attr('stroke', C.cyan).attr('stroke-width', 6).attr('marker-end', 'url(#arr-cyan)');
  vg.append('line').attr('x1', o2[0]).attr('y1', o2[1]).attr('x2', pb[0]).attr('y2', pb[1])
    .attr('stroke', C.magenta).attr('stroke-width', 6).attr('marker-end', 'url(#arr-magenta)');
  // arc: slerp between unit a and unit b at radius rArc, projected
  const rArc = 0.36;
  const ub = unit(bPt.p);
  const arcPts = d3.range(0, 1.0001, 0.02).map((t) => {
    const s = Math.sin(theta);
    const v = add(scale(ua, Math.sin((1 - t) * theta) / s), scale(ub, Math.sin(t * theta) / s));
    return proj(scale(v, rArc));
  });
  vg.append('path').attr('d', d3.line()(arcPts)).attr('fill', 'none').attr('stroke', C.amber).attr('stroke-width', 5);
  // wedge fill
  g.append('path').attr('d', d3.line()([o2, ...arcPts, o2])).attr('fill', C.amber).attr('fill-opacity', 0.14);

  // ---------- k-NN lines ----------
  const kg = g.append('g');
  const pq = proj(q.p);
  for (const d of knn) {
    const [x, y] = proj(d.p);
    kg.append('line').attr('x1', pq[0]).attr('y1', pq[1]).attr('x2', x).attr('y2', y)
      .attr('stroke', C.white).attr('stroke-width', 3).attr('stroke-opacity', 0.9).attr('stroke-dasharray', '8 6');
    kg.append('circle').attr('cx', x).attr('cy', y).attr('r', 16).attr('fill', 'none')
      .attr('stroke', C.white).attr('stroke-width', 3);
  }
  // query + b markers
  const mk = g.append('g').attr('filter', 'url(#glow-m)');
  mk.append('circle').attr('cx', pq[0]).attr('cy', pq[1]).attr('r', 18).attr('fill', C.cyan);
  mk.append('circle').attr('cx', pq[0]).attr('cy', pq[1]).attr('r', 34).attr('fill', 'none').attr('stroke', C.cyan).attr('stroke-width', 3);
  mk.append('circle').attr('cx', pb[0]).attr('cy', pb[1]).attr('r', 15).attr('fill', C.magenta);
  mk.append('circle').attr('cx', pb[0]).attr('cy', pb[1]).attr('r', 30).attr('fill', 'none').attr('stroke', C.magenta).attr('stroke-width', 3);

  if (isBg) { P.done(); return; }

  // ---------- labels ----------
  const lab = g.append('g');
  // dark backing plate behind a label that sits inside the point cloud
  const plate = (t, pad = 10) => {
    const b = t.node().getBBox();
    lab.insert('rect', () => t.node()).attr('x', b.x - pad).attr('y', b.y - pad / 2)
      .attr('width', b.width + 2 * pad).attr('height', b.height + pad).attr('rx', 6)
      .attr('fill', C.bg).attr('fill-opacity', 0.78);
    return t;
  };
  const leader = (x1, y1, x2, y2, col) => lab.append('path').attr('d', `M${x1} ${y1}L${x2} ${y2}`)
    .attr('stroke', col).attr('stroke-opacity', 0.7).attr('stroke-width', 2).attr('fill', 'none');

  // k-NN callouts, fanned outward (away from the origin) so they don't collide
  const out = Math.atan2(pq[1] - o2[1], pq[0] - o2[0]);
  const fan = knn.map((d) => {
    const [x, y] = proj(d.p);
    let ang = Math.atan2(y - pq[1], x - pq[0]) - out;
    ang = Math.atan2(Math.sin(ang), Math.cos(ang));
    return { d, x, y, ang };
  }).sort((u, v) => u.ang - v.ang);
  const span = 0.3;
  fan.forEach((f, i) => { f.la = out + (i - (fan.length - 1) / 2) * span; });
  for (const f of fan) {
    const R = 300;
    const lx = pq[0] + Math.cos(f.la) * R, ly = pq[1] + Math.sin(f.la) * R;
    leader(f.x, f.y, lx, ly, C.white);
    const right = Math.cos(f.la) >= 0;
    const t = text(lab, lx + (right ? 14 : -14), ly + 12, `${f.d.name} `, { size: 32, anchor: right ? 'start' : 'end', weight: 700 });
    t.append('tspan').attr('fill', C.cyan).attr('font-weight', 400).text(f.d.s.toFixed(3));
  }
  // vector labels at the shaft midpoints, offset perpendicular
  const vlab = (pt, str, col, side) => {
    const mx = (o2[0] + pt[0]) / 2, my = (o2[1] + pt[1]) / 2;
    const dx = pt[0] - o2[0], dy = pt[1] - o2[1], l = Math.hypot(dx, dy);
    const nx = -dy / l * side, ny = dx / l * side;
    plate(text(lab, mx + nx * 46, my + ny * 46 + 14, str, { size: 40, anchor: 'middle', fill: col, weight: 700 }), 6);
  };
  vlab(pa, 'a', C.cyan, 1);
  vlab(pb, 'b', C.magenta, -1);
  plate(text(lab, pq[0] + 56, pq[1] - 60, 'query · JAK2', { size: 36, fill: C.cyan, weight: 700 }));
  plate(text(lab, pb[0] + 46, pb[1] + 70, 'BRAF', { size: 36, fill: C.magenta, weight: 700 }));

  // θ
  const mid = arcPts[Math.floor(arcPts.length / 2)];
  const dir = [mid[0] - o2[0], mid[1] - o2[1]];
  const dl = Math.hypot(dir[0], dir[1]);
  text(lab, mid[0] + dir[0] / dl * 46, mid[1] + dir[1] / dl * 46 + 14, 'θ', { size: 44, anchor: 'middle', fill: C.amber, weight: 700 });

  // cluster labels, pushed outward from the origin along the cluster direction
  const place = { kin: [-1, 1, 0, 230], onco: [-1, 0, 0, 0], ts: [1, 0, 0, 0], ab: [1, 0, 0, 0], lig: [1, 0, 0, 0] };
  const fixedAng = { ts: -10 }; // degrees; overrides the outward direction
  for (const c of clusters) {
    const [x, y] = proj(c.center);
    const dx = x - o2[0], dy = y - o2[1], dl2 = Math.hypot(dx, dy);
    const [side, , , down] = place[c.key];
    let ux = dx / dl2, uy = dy / dl2;
    if (fixedAng[c.key] != null) { const t = fixedAng[c.key] * Math.PI / 180; ux = Math.cos(t); uy = Math.sin(t); }
    const lx = x + ux * 250, ly = y + uy * 250 + down;
    const right = side > 0;
    leader(x + ux * 120, y + uy * 120 + down * 0.4, lx + (right ? -12 : 12), ly - 12, c.color);
    text(lab, lx, ly, c.name, { size: 40, anchor: right ? 'start' : 'end', fill: c.color, weight: 700 });
    text(lab, lx, ly + 42, `n = ${NPC}`, { size: 28, anchor: right ? 'start' : 'end', opacity: 0.5 });
  }

  // ---------- right panel ----------
  const px = 2900, py = 560;
  const pg = g.append('g');
  pg.append('path').attr('d', `M${px - 30} ${py - 40}h44M${px - 30} ${py - 40}v44`).attr('stroke', C.cyan).attr('stroke-width', 3).attr('fill', 'none');
  text(pg, px, py, 'COSINE SIMILARITY', { size: 30, fill: C.cyan, spacing: 3, weight: 500 });
  text(pg, px, py + 80, 'cos θ = a·b / (‖a‖ ‖b‖)', { size: 44, weight: 700 });
  const ct = text(pg, px, py + 190, `cos θ = ${cosAB.toFixed(2)}`, { size: 76, weight: 700, fill: C.amber, filter: 'glow-s' });
  text(pg, px, py + 250, `θ = ${(theta * 180 / Math.PI).toFixed(1)}° · JAK2 vs BRAF`, { size: 32, opacity: 0.7 });

  const ty0 = py + 380;
  text(pg, px, ty0, `TOP-${K} NEIGHBOURS OF JAK2`, { size: 30, fill: C.cyan, spacing: 3, weight: 500 });
  knn.forEach((d, i) => {
    const y = ty0 + 70 + i * 66;
    text(pg, px, y, `${i + 1}`, { size: 32, opacity: 0.5 });
    text(pg, px + 50, y, d.name, { size: 34, weight: 700 });
    const bx = px + 260, bw = 330;
    const t = (d.s - 0.9) / 0.1; // bar spans 0.90 … 1.00
    pg.append('rect').attr('x', bx).attr('y', y - 22).attr('width', bw).attr('height', 18)
      .attr('fill', 'none').attr('stroke', C.white).attr('stroke-opacity', 0.25).attr('stroke-width', 2);
    pg.append('rect').attr('x', bx).attr('y', y - 22).attr('width', bw * t).attr('height', 18).attr('fill', C.cyan);
    text(pg, bx + bw + 20, y, d.s.toFixed(3), { size: 32, fill: C.cyan });
  });
  const yb = ty0 + 70 + K * 66;
  text(pg, px, yb, '–', { size: 32, opacity: 0.5 });
  text(pg, px + 50, yb, 'BRAF', { size: 34, weight: 700, fill: C.magenta });
  pg.append('rect').attr('x', px + 260).attr('y', yb - 22).attr('width', 330).attr('height', 18)
    .attr('fill', 'none').attr('stroke', C.white).attr('stroke-opacity', 0.25).attr('stroke-width', 2);
  pg.append('rect').attr('x', px + 260).attr('y', yb - 22).attr('width', 330 * (cosAB - 0.9) / 0.1).attr('height', 18).attr('fill', C.magenta);
  text(pg, px + 610, yb, cosAB.toFixed(3), { size: 32, fill: C.magenta });
  text(pg, px, yb + 60, 'bar axis: 0.90 → 1.00', { size: 28, opacity: 0.45 });

  // legend
  const ly0 = yb + 160;
  clusters.forEach((c, i) => {
    const y = ly0 + i * 52;
    const m = pg.append('circle').attr('cx', px + 14).attr('cy', y - 10).attr('r', 12);
    if (c.hollow) m.attr('fill', 'none').attr('stroke', c.color).attr('stroke-width', 3);
    else m.attr('fill', c.color);
    text(pg, px + 46, y, c.name, { size: 30, opacity: 0.8 });
  });

  P.done();
})();
</script>
</body>
</html>
