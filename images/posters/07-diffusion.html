<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diffusion Model — HackNHeal</title>
<link rel="stylesheet" href="../assets/tokens.css">
<script src="../assets/vendor/d3.v7.9.0.min.js"></script>
<script src="../lib/poster.js"></script>
</head>
<body>
<script>
(async () => {
  const P = await Poster.create({
    num: '07', id: 'diffusion', title: 'Diffusion Model',
    subtitle: 'Denoising a protein backbone out of Gaussian noise · DDPM',
    hudTop: 'T = 1000 · COSINE SCHEDULE', hudSub: 'Cα ATOMS · ℝ^{3} COORDS', // count patched in below
  });
  const { W, H, C, g, rng, isBg, text, defs } = P;

  // ---------------- x₀: a Cα trace with real secondary-structure geometry ----------------
  const v3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
  };
  // α-helix: radius 2.3 Å, rise 1.5 Å, 100°/residue → Cα–Cα ≈ 3.8 Å. Axis along +y.
  const helix = (n, origin, dir, phase = 0) => d3.range(n).map((i) => {
    const t = (i * 100 + phase) * Math.PI / 180;
    return [origin[0] + 2.3 * Math.cos(t), origin[1] + dir * 1.5 * i, origin[2] + 2.3 * Math.sin(t)];
  });
  // β-strand: 3.3 Å per residue along the axis, ±0.94 Å zig-zag → ≈ 3.8 Å
  const strand = (n, origin, dir) => d3.range(n).map((i) => [origin[0] + (i % 2 ? 0.94 : -0.94), origin[1] + dir * 3.3 * i, origin[2]]);
  // loop: Catmull-Rom between segment ends, resampled at 3.8 Å
  const loop = (a, b, bulge) => {
    const mid = v3.add(v3.mul(v3.add(a, b), 0.5), bulge);
    const pts = [a, mid, b];
    const curve = d3.range(0, 1.0001, 0.01).map((t) => {
      const u = 1 - t;
      return [0, 1, 2].map((k) => u * u * pts[0][k] + 2 * u * t * pts[1][k] + t * t * pts[2][k]);
    });
    const out = []; let acc = 0;
    for (let i = 1; i < curve.length; i++) {
      acc += v3.len(v3.sub(curve[i], curve[i - 1]));
      if (acc >= 3.8) { out.push(curve[i]); acc = 0; }
    }
    if (out.length && v3.len(v3.sub(out[out.length - 1], b)) < 2) out.pop();
    return out;
  };
  const segs = [];
  const H1 = helix(16, [0, 0, 0], 1);                    // helix A going up
  const S1 = strand(8, [10, 24, 2], -1);                 // strand 1 going down
  const S2 = strand(8, [14.8, 24 - 3.3 * 7, 2.2], 1);    // antiparallel strand 2, 4.8 Å away
  const H2 = helix(14, [24, 26, -2], -1, 40);            // helix B going down
  const L1 = loop(H1[H1.length - 1], S1[0], [0, 6, 2]);
  const L2 = loop(S1[S1.length - 1], S2[0], [0, -3, 0]);
  const L3 = loop(S2[S2.length - 1], H2[0], [0, 6, -2]);
  for (const [arr, ss] of [[H1, 'H'], [L1, 'L'], [S1, 'E'], [L2, 'L'], [S2, 'E'], [L3, 'L'], [H2, 'H']]) for (const p of arr) segs.push({ p, ss });
  // normalise to zero mean / unit variance (the data scaling diffusion models assume)
  const mean = [0, 1, 2].map((k) => d3.mean(segs, (d) => d.p[k]));
  const sd = Math.sqrt(d3.mean(segs, (d) => [0, 1, 2].reduce((a, k) => a + (d.p[k] - mean[k]) ** 2, 0) / 3));
  const x0 = segs.map((d) => [0, 1, 2].map((k) => (d.p[k] - mean[k]) / sd));
  const ssOf = segs.map((d) => d.ss);
  const NRES = x0.length;
  // put the real residue count into the HUD
  P.chrome.selectAll('text').filter(function () { return this.textContent.includes('ATOMS'); })
    .each(function () { Poster.mathText(d3.select(this), `${NRES} Cα ATOMS · ℝ^{3} COORDS`, 30); });

  // ---------------- forward process: closed form with one fixed ε ----------------
  const T = 1000, s = 0.008;
  const fcos = (t) => Math.cos(((t / T + s) / (1 + s)) * Math.PI / 2) ** 2;
  const abar = (t) => Math.max(0, fcos(t) / fcos(0));
  const erng = rng.fork('eps');
  const eps = x0.map(() => [erng.normal(), erng.normal(), erng.normal()]);
  const ts = [1000, 800, 600, 400, 200, 0];
  const frames = ts.map((t) => {
    const a = abar(t);
    return { t, a, x: x0.map((p, i) => p.map((v, k) => Math.sqrt(a) * v + Math.sqrt(1 - a) * eps[i][k])) };
  });

  // ---------------- layout ----------------
  const PS = isBg ? 600 : 500, GAP = isBg ? 0 : 104;
  const slots = isBg
    ? [[240, 240], [1620, 240], [3000, 240], [240, 1320], [1620, 1320], [3000, 1320]]
    : d3.range(6).map((i) => [170 + i * (PS + GAP), 760]);
  // rotation for the projection (fixed view of the fold)
  const ry = -0.35, rx = 0.95;
  const rot = ([x, y, z]) => {
    const x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
    const y1 = y * Math.cos(rx) - z1 * Math.sin(rx), z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
    return [x1, y1, z2];
  };
  const SC = PS * 0.2; // px per normalised unit
  const ssCol = { H: C.cyan, E: C.amber, L: C.white };

  frames.forEach((fr, fi) => {
    const [px, py] = slots[fi];
    const clipId = `clip-f${fi}`;
    defs.append('clipPath').attr('id', clipId).append('rect').attr('x', px).attr('y', py).attr('width', PS).attr('height', PS).attr('rx', 12);
    const fg = g.append('g');
    fg.append('rect').attr('x', px).attr('y', py).attr('width', PS).attr('height', PS).attr('rx', 12)
      .attr('fill', C.cyan).attr('fill-opacity', 0.025);
    const inner = fg.append('g').attr('clip-path', `url(#${clipId})`);
    for (let k = 1; k < 5; k++) {
      inner.append('line').attr('x1', px + (PS * k) / 5).attr('x2', px + (PS * k) / 5).attr('y1', py).attr('y2', py + PS).attr('stroke', C.white).attr('stroke-opacity', 0.05).attr('stroke-width', 1.5);
      inner.append('line').attr('y1', py + (PS * k) / 5).attr('y2', py + (PS * k) / 5).attr('x1', px).attr('x2', px + PS).attr('stroke', C.white).attr('stroke-opacity', 0.05).attr('stroke-width', 1.5);
    }
    const cx = px + PS / 2, cy = py + PS / 2;
    const pts = fr.x.map(rot).map(([x, y, z]) => [cx + x * SC, cy - y * SC, z]);
    const clean = fr.a > 0.85;
    const trace = inner.append('g').attr('filter', clean ? 'url(#glow-s)' : null);
    for (let i = 1; i < NRES; i++) {
      trace.append('line').attr('x1', pts[i - 1][0]).attr('y1', pts[i - 1][1]).attr('x2', pts[i][0]).attr('y2', pts[i][1])
        .attr('stroke', ssCol[ssOf[i]]).attr('stroke-width', clean ? 6 : 3)
        .attr('stroke-opacity', 0.25 + 0.65 * fr.a).attr('stroke-linecap', 'round');
    }
    const order = d3.range(NRES).sort((a, b) => pts[a][2] - pts[b][2]);
    for (const i of order) {
      inner.append('circle').attr('cx', pts[i][0]).attr('cy', pts[i][1]).attr('r', clean ? 7 : 6)
        .attr('fill', ssCol[ssOf[i]]).attr('fill-opacity', 0.55 + 0.45 * fr.a);
    }
    // frame chrome
    fg.append('rect').attr('x', px).attr('y', py).attr('width', PS).attr('height', PS).attr('rx', 12)
      .attr('fill', 'none').attr('stroke', fi === 5 ? C.cyan : C.white).attr('stroke-opacity', fi === 5 ? 0.9 : 0.35).attr('stroke-width', fi === 5 ? 4 : 2.5)
      .attr('filter', fi === 5 ? 'url(#glow-s)' : null);
    if (!isBg) {
      const nm = fr.t === T ? 'x_{T}' : fr.t === 0 ? 'x_{0}' : `x_{${fr.t}}`;
      text(g, px, py - 28, nm, { size: 44, weight: 700, fill: fi === 5 ? C.cyan : C.white });
      text(g, px + PS, py - 28, `t = ${fr.t}`, { size: 30, anchor: 'end', opacity: 0.6 });
      // signal vs noise composition: √ᾱ (signal) and √(1−ᾱ) (noise) amplitudes
      const sa = Math.sqrt(fr.a), na = Math.sqrt(1 - fr.a);
      const by = py + PS + 40, bw = PS;
      text(g, px, by + 34, `ᾱ_{t} = ${fr.a.toFixed(3)}`, { size: 32, fill: C.white, weight: 500 });
      g.append('rect').attr('x', px).attr('y', by + 62).attr('width', bw).attr('height', 14).attr('fill', C.white).attr('fill-opacity', 0.08);
      g.append('rect').attr('x', px).attr('y', by + 62).attr('width', bw * sa / (sa + na)).attr('height', 14).attr('fill', C.cyan);
      g.append('rect').attr('x', px + bw * sa / (sa + na)).attr('y', by + 62).attr('width', bw * na / (sa + na)).attr('height', 14).attr('fill', C.magenta).attr('fill-opacity', 0.75);
      text(g, px, by + 120, `√ᾱ = ${sa.toFixed(2)}`, { size: 28, fill: C.cyan });
      text(g, px + PS, by + 120, `√(1−ᾱ) = ${na.toFixed(2)}`, { size: 28, fill: C.magenta, anchor: 'end' });
    }
  });

  // per-gap arrows: reverse (top, cyan →) and forward (bottom, magenta dashed ←)
  const ar = g.append('g');
  for (let i = 0; i < 5; i++) {
    const [ax, ay] = slots[i], [bx, by2] = slots[i + 1];
    if (isBg && ay !== by2) continue;
    const x1 = ax + PS + 12, x2 = bx - 12;
    const yTop = ay + PS * 0.36, yBot = ay + PS * 0.64;
    ar.append('path').attr('d', `M${x1} ${yTop}Q${(x1 + x2) / 2} ${yTop - 44} ${x2 - 6} ${yTop}`).attr('fill', 'none')
      .attr('stroke', C.cyan).attr('stroke-width', 5).attr('marker-end', 'url(#arr-cyan)').attr('filter', 'url(#glow-s)');
    ar.append('path').attr('d', `M${x2} ${yBot}Q${(x1 + x2) / 2} ${yBot + 44} ${x1 + 6} ${yBot}`).attr('fill', 'none')
      .attr('stroke', C.magenta).attr('stroke-width', 4).attr('stroke-dasharray', '9 7').attr('marker-end', 'url(#arr-magenta)');
  }

  if (isBg) { P.done(); return; }

  // ---------------- process banners ----------------
  const x0b = slots[0][0], x1b = slots[5][0] + PS;
  const yR = 590;
  g.append('line').attr('x1', x0b).attr('x2', x1b).attr('y1', yR).attr('y2', yR).attr('stroke', C.cyan).attr('stroke-width', 4)
    .attr('marker-end', 'url(#arr-cyan)').attr('filter', 'url(#glow-s)');
  const rl = text(g, (x0b + x1b) / 2, yR - 30, 'REVERSE · generative · learned:  p_{θ}(x_{t−1} | x_{t})', { size: 40, anchor: 'middle', fill: C.cyan, weight: 700 });
  const yF = 1500;
  g.append('line').attr('x1', x1b).attr('x2', x0b).attr('y1', yF).attr('y2', yF).attr('stroke', C.magenta).attr('stroke-width', 4)
    .attr('stroke-dasharray', '16 10').attr('marker-end', 'url(#arr-magenta)');
  text(g, (x0b + x1b) / 2, yF + 62, 'FORWARD · noising · fixed:  q(x_{t} | x_{t−1}) = N(x_{t}; √(1−β_{t}) x_{t−1}, β_{t} I)', { size: 40, anchor: 'middle', fill: C.magenta, weight: 700 });

  // ---------------- equations ----------------
  const ex = 170, ey = 1720;
  const eg = g.append('g');
  eg.append('path').attr('d', `M${ex - 20} ${ey - 44}h44M${ex - 20} ${ey - 44}v44`).attr('stroke', C.cyan).attr('stroke-width', 3).attr('fill', 'none');
  text(eg, ex, ey, 'CLOSED FORM (every frame above)', { size: 28, fill: C.cyan, spacing: 3, weight: 500 });
  text(eg, ex, ey + 70, 'x_{t} = √ᾱ_{t} x_{0} + √(1−ᾱ_{t}) ε,  ε ~ N(0, I)', { size: 40, weight: 700 });
  text(eg, ex, ey + 130, 'ᾱ_{t} = Π_{s≤t} (1−β_{s}) · cosine schedule, same ε in all frames', { size: 30, opacity: 0.7 });

  const tx = 2000;
  eg.append('path').attr('d', `M${tx - 20} ${ey - 44}h44M${tx - 20} ${ey - 44}v44`).attr('stroke', C.cyan).attr('stroke-width', 3).attr('fill', 'none');
  text(eg, tx, ey, 'TRAINING OBJECTIVE (Ho et al., 2020)', { size: 28, fill: C.cyan, spacing: 3, weight: 500 });
  text(eg, tx, ey + 70, 'L_{simple} = E_{t,x0,ε} ‖ε − ε_{θ}(x_{t}, t)‖²', { size: 40, weight: 700 });
  text(eg, tx, ey + 130, 'network predicts the noise; sampling runs t = T → 0', { size: 30, opacity: 0.7 });

  // SSE legend (top right, under HUD)
  const lx = 2700, ly = 420;
  [['α-helix', C.cyan], ['β-strand', C.amber], ['loop', C.white]].forEach(([nm, col], i) => {
    const x = lx + i * 340;
    g.append('line').attr('x1', x).attr('x2', x + 56).attr('y1', ly - 10).attr('y2', ly - 10).attr('stroke', col).attr('stroke-width', 6);
    g.append('circle').attr('cx', x + 28).attr('cy', ly - 10).attr('r', 8).attr('fill', col);
    text(g, x + 74, ly, nm, { size: 30, opacity: 0.85 });
  });
  text(g, lx, ly + 54, 'colour = residue’s secondary structure in x_{0}', { size: 28, opacity: 0.5 });

  P.done();
})();
</script>
</body>
</html>
